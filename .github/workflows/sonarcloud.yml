name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ansible.cfg names ~/.vault_pass. CI has no encrypted files (the
      # production inventory is not committed), so any password will do.
      - name: Placeholder vault password
        run: echo ci-placeholder > ~/.vault_pass

      # The action installs its own ansible-core and the collections in
      # requirements.yml; pinned to the v26.10.1 commit.
      - name: Run ansible-lint
        uses: ansible/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164  # v26.10.1
        with:
          working_directory: ansible
          requirements_file: requirements.yml

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ansible-lint and collections
        run: |
          pip install "ansible-lint==26.10.1"
          ansible-galaxy collection install -r ansible/requirements.yml
          echo ci-placeholder > ~/.vault_pass

      - name: Run ansible-lint with JSON output
        run: |
          cd ansible
          ansible-lint --format json --output-file ../ansible-lint-report.json . || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

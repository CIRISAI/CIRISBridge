# Common setup for all CIRISBridge hosts
---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - ufw
      - fail2ban
      - htop
      - vim
      - git
      - jq
      - unzip
    state: present

- name: Set timezone
  community.general.timezone:
    name: UTC

- name: Configure UFW defaults
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

# DECOMMISSIONED 2026-05-02: Port 53 was open for Constellation DNS, which has
# been retired in favor of Reticulum. Re-enable if running an authoritative DNS
# service on these nodes again. (Existing rules on the firewalls will be deleted
# the next time `ufw delete` runs against them; for now they're harmless since
# no process listens on :53.)
# - name: Allow DNS (UDP)
#   community.general.ufw:
#     rule: allow
#     port: "53"
#     proto: udp
#
# - name: Allow DNS (TCP)
#   community.general.ufw:
#     rule: allow
#     port: "53"
#     proto: tcp

- name: Allow HTTP (for ACME)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow Docker networks to access billing API (host networking)
  community.general.ufw:
    rule: allow
    from_ip: 172.16.0.0/12
    to_port: "8000"
    proto: tcp
    comment: "Docker to billing API"

- name: Install Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Set Docker arch fact
  ansible.builtin.set_fact:
    docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Create Docker config directory
  ansible.builtin.file:
    path: /root/.docker
    state: directory
    mode: "0700"

- name: Configure GHCR authentication
  ansible.builtin.copy:
    dest: /root/.docker/config.json
    content: |
      {
        "auths": {
          "ghcr.io": {
            "auth": "{{ ghcr_auth_token }}"
          }
        }
      }
    mode: "0600"
  when: ghcr_auth_token is defined

- name: Create CIRIS directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/ciris
    - /opt/ciris/billing
    - /opt/ciris/proxy
    - /opt/ciris/dns
    - /opt/ciris/caddy
    - /opt/ciris/postgres
    - /var/log/ciris

- name: Configure fail2ban
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
    mode: "0644"
  notify: Restart fail2ban

# SSH Hardening - disable password auth, key-only access
# Uses 00- prefix to load before cloud-init configs (first match wins in sshd)
- name: Harden SSH configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ciris-hardening.conf
    content: |
      # CIRISBridge SSH Hardening
      # Managed by Ansible - do not edit manually

      # Disable password authentication (key-only)
      PasswordAuthentication no
      KbdInteractiveAuthentication no

      # Enable public key authentication
      PubkeyAuthentication yes

      # Note: PermitRootLogin left as provider default
      # Root access is protected by key-only auth + fail2ban
    mode: "0644"
  notify: Reload sshd

# The nf_conntrack keys below only exist once the module is loaded. At boot
# systemd-sysctl ran before Docker loaded it, so the 262144 in sysctl.conf was
# silently skipped and both nodes came back at the kernel default 65536 (first
# seen after the 2026-09-25 kernel reboots). modules-load.d runs before
# systemd-sysctl, so loading the module there makes the setting stick.
- name: Load nf_conntrack at boot so its sysctls apply
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nf_conntrack.conf
    content: "nf_conntrack\n"
    owner: root
    group: root
    mode: "0644"
  tags: [sysctl]

- name: Load nf_conntrack now
  community.general.modprobe:
    name: nf_conntrack
    state: present
  tags: [sysctl]

- name: Configure sysctl for performance
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  tags: [sysctl]
  loop:
    - { name: "net.core.somaxconn", value: "65535" }
    - { name: "net.ipv4.tcp_max_syn_backlog", value: "65535" }
    - { name: "vm.overcommit_memory", value: "1" }
    # nf_conntrack: raised from default 65536. Root cause of the 2026-08-20 US
    # network freeze is unconfirmed — dmesg didn't survive the reboot, and a
    # canonical Reticulum node measured only ~100 entries (Reticulum multiplexes
    # peers over a handful of UDP sockets, so peer count ≠ conntrack entries).
    # Sized at 262144 against edge MAX_PEERS=4096, ~64 MB kernel memory — cheap
    # and harmless regardless of true cause. Daily conntrack monitoring will
    # confirm whether US steady-state approaches the old 65536 ceiling.
    # buckets must equal max for O(1) lookup; both written together.
    - { name: "net.netfilter.nf_conntrack_max", value: "262144" }
    - { name: "net.netfilter.nf_conntrack_buckets", value: "262144" }

# CIRISBridge Scheduler Role
# Deploys systemd timers for health checks and maintenance tasks
# Job results go to the system journal under the ciris-scheduler tag
---
- name: Create scheduler directory
  ansible.builtin.file:
    path: /opt/ciris/scheduler
    state: directory
    mode: "0750"
    owner: root
    group: root

# ============================================================================
# DEPLOY SCRIPTS
# ============================================================================
- name: Deploy daily checks script
  ansible.builtin.template:
    src: ciris-daily-checks.sh.j2
    dest: /opt/ciris/scheduler/ciris-daily-checks.sh
    mode: "0750"
    owner: root
    group: root

- name: Deploy weekly security script
  ansible.builtin.template:
    src: ciris-weekly-security.sh.j2
    dest: /opt/ciris/scheduler/ciris-weekly-security.sh
    mode: "0750"
    owner: root
    group: root

- name: Deploy weekly cleanup script
  ansible.builtin.template:
    src: ciris-weekly-cleanup.sh.j2
    dest: /opt/ciris/scheduler/ciris-weekly-cleanup.sh
    mode: "0750"
    owner: root
    group: root

- name: Deploy OOM watchdog script (US only — ciris-server + ciris-status run here)
  ansible.builtin.template:
    src: ciris-oom-watchdog.sh.j2
    dest: /opt/ciris/scheduler/ciris-oom-watchdog.sh
    mode: "0750"
    owner: root
    group: root
  when: inventory_hostname == 'vultr'
  notify: Restart OOM watchdog service

- name: Deploy read-API watchdog script (US only — ciris-server runs here)
  ansible.builtin.template:
    src: ciris-readapi-watchdog.sh.j2
    dest: /opt/ciris/scheduler/ciris-readapi-watchdog.sh
    mode: "0750"
    owner: root
    group: root
  when: inventory_hostname == 'vultr'
  notify: Restart read-API watchdog service

- name: Deploy read-API forensics collector (US only)
  ansible.builtin.template:
    src: ciris-readapi-forensics.sh.j2
    dest: /opt/ciris/scheduler/ciris-readapi-forensics.sh
    mode: "0750"
    owner: root
    group: root
  when: inventory_hostname == 'vultr'

- name: Deploy Spock billing backup script
  ansible.builtin.template:
    src: ciris-spock-backup.sh.j2
    dest: /opt/ciris/scheduler/ciris-spock-backup.sh
    mode: "0750"
    owner: root
    group: root

# ============================================================================
# DEPLOY SYSTEMD SERVICES
# ============================================================================
- name: Deploy daily checks service
  ansible.builtin.template:
    src: ciris-daily-checks.service.j2
    dest: /etc/systemd/system/ciris-daily-checks.service
    mode: "0644"
  notify: Reload systemd

- name: Deploy weekly security service
  ansible.builtin.template:
    src: ciris-weekly-security.service.j2
    dest: /etc/systemd/system/ciris-weekly-security.service
    mode: "0644"
  notify: Reload systemd

- name: Deploy weekly cleanup service
  ansible.builtin.template:
    src: ciris-weekly-cleanup.service.j2
    dest: /etc/systemd/system/ciris-weekly-cleanup.service
    mode: "0644"
  notify: Reload systemd

- name: Deploy Spock billing backup service
  ansible.builtin.template:
    src: ciris-spock-backup.service.j2
    dest: /etc/systemd/system/ciris-spock-backup.service
    mode: "0644"
  notify: Reload systemd

- name: Deploy OOM watchdog service (US only)
  ansible.builtin.template:
    src: ciris-oom-watchdog.service.j2
    dest: /etc/systemd/system/ciris-oom-watchdog.service
    mode: "0644"
  when: inventory_hostname == 'vultr'
  notify:
    - Reload systemd
    - Restart OOM watchdog service

- name: Deploy read-API watchdog service (US only)
  ansible.builtin.template:
    src: ciris-readapi-watchdog.service.j2
    dest: /etc/systemd/system/ciris-readapi-watchdog.service
    mode: "0644"
  when: inventory_hostname == 'vultr'
  notify:
    - Reload systemd
    - Restart read-API watchdog service

- name: Remove legacy OOM watchdog timer (superseded by live-stream service — a 5-min
    poll of `docker events --since` silently loses die events to dockerd's 256-entry
    ring buffer, which proxy/billing/caddy healthcheck traffic evicts in ~10-15 min)
  ansible.builtin.systemd:
    name: ciris-oom-watchdog.timer
    state: stopped
    enabled: false
  when: inventory_hostname == 'vultr'
  failed_when: false

- name: Remove legacy OOM watchdog timer unit file (US only)
  ansible.builtin.file:
    path: /etc/systemd/system/ciris-oom-watchdog.timer
    state: absent
  when: inventory_hostname == 'vultr'
  notify: Reload systemd

# ============================================================================
# DEPLOY SYSTEMD TIMERS
# ============================================================================
- name: Deploy daily checks timer
  ansible.builtin.template:
    src: ciris-daily-checks.timer.j2
    dest: /etc/systemd/system/ciris-daily-checks.timer
    mode: "0644"
  notify:
    - Reload systemd
    - Enable daily checks timer

- name: Deploy weekly security timer
  ansible.builtin.template:
    src: ciris-weekly-security.timer.j2
    dest: /etc/systemd/system/ciris-weekly-security.timer
    mode: "0644"
  notify:
    - Reload systemd
    - Enable weekly security timer

- name: Deploy weekly cleanup timer
  ansible.builtin.template:
    src: ciris-weekly-cleanup.timer.j2
    dest: /etc/systemd/system/ciris-weekly-cleanup.timer
    mode: "0644"
  notify:
    - Reload systemd
    - Enable weekly cleanup timer

- name: Deploy Spock billing backup timer
  ansible.builtin.template:
    src: ciris-spock-backup.timer.j2
    dest: /etc/systemd/system/ciris-spock-backup.timer
    mode: "0644"
  notify:
    - Reload systemd
    - Enable spock backup timer

# ============================================================================
# ENSURE TIMERS ARE ENABLED AND STARTED
# ============================================================================
- name: Ensure all timers are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - ciris-daily-checks.timer
    - ciris-weekly-security.timer
    - ciris-weekly-cleanup.timer

- name: Ensure Spock billing backup timer is enabled
  ansible.builtin.systemd:
    name: ciris-spock-backup.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure read-API watchdog service is enabled and running (US only)
  ansible.builtin.systemd:
    name: ciris-readapi-watchdog.service
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == 'vultr'

- name: Ensure OOM watchdog service is enabled and running (US only)
  ansible.builtin.systemd:
    name: ciris-oom-watchdog.service
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == 'vultr'

# Retired jobs: the CIRISLens backup (nothing left to back up) and the
# heartbeat (it only posted liveness to the CIRISLens ingest endpoint). Remove
# them from nodes that still carry them.
- name: Stop and disable retired timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - ciris-lens-backup.timer
    - ciris-heartbeat.timer
  failed_when: false

- name: Remove retired units and scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/ciris-lens-backup.timer
    - /etc/systemd/system/ciris-lens-backup.service
    - /opt/ciris/scheduler/ciris-lens-backup.sh
    - /etc/systemd/system/ciris-heartbeat.timer
    - /etc/systemd/system/ciris-heartbeat.service
    - /opt/ciris/scheduler/ciris-heartbeat.sh
  notify: Reload systemd

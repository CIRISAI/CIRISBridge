---
# Deploy CIRISServer — the fabric node (v0.5.0, zero-env CLI-flag boot).
# Replaces the retired CIRISLens deployment.
# Boot inputs (Dockerfile ENTRYPOINT): --home + --key-id. NO env vars are read.
# All non-default config is authored as signed config:* CEG objects via the API
# after ownership is claimed (NodeCode + PIN), per BRIDGE_UPGRADE_v0.5.0 §7.
#
# Production: US node only.

- name: Check if this is a server node
  ansible.builtin.set_fact:
    is_ciris_server_node: "{{ (node_name | default('') == 'us') or (deploy_ciris_server | default(false)) }}"

- name: Skip if not a server node
  ansible.builtin.debug:
    msg: "Skipping CIRISServer deployment — only runs on US/server nodes"
  when: not is_ciris_server_node

- name: Deploy CIRISServer
  when: is_ciris_server_node
  block:
    # Backup existing data + identity before any upgrade (runbook §2 "do NOT skip").
    # No-op on first deploy (no source). Idempotent: backups carry their own bak suffix
    # and won't overwrite each other beyond the most recent.
    - name: Check whether prior CIRISServer data exists (for backup decision)
      ansible.builtin.stat:
        path: "{{ ciris_server_data_dir }}/data"
      register: existing_data

    # Each snapshot is a full copy of the corpus (~1.4 GB and growing). This task
    # ran on EVERY deploy and pruned nothing: by 2026-08-28 it had accumulated
    # 186 snapshots / 29 GB dating back to July, filling the 75 GB disk to 96%.
    # That dropped free space under ciris-server's baked 5 GiB lens-store
    # minimum, so the node fail-safe demoted ITSELF out of its federation role
    # (`host capabilities disk_free_gib=3 lens_store=false` -> "running as a
    # Reticulum relay node only"). A backup policy took the canonical offline.
    # Retention is now bounded here, and pruning happens BEFORE the new copy so
    # a nearly-full disk cannot be tipped over by the snapshot itself.
    - name: Prune old upgrade snapshots (keep {{ ciris_server_bak_retain }})
      ansible.builtin.shell: |
        set -o pipefail
        for kind in data identity; do
          ls -d {{ ciris_server_data_dir }}/${kind}.bak.* 2>/dev/null \
            | sort \
            | head -n -{{ ciris_server_bak_retain }} \
            | xargs -r rm -rf
        done
        exit 0
      args:
        executable: /bin/bash
      when: not (ciris_server_fresh | default(false))
      changed_when: false

    - name: Snapshot data + identity dirs to .bak before upgrade
      ansible.builtin.shell: |
        set -e
        ts=$(date -u +%Y%m%dT%H%M%SZ)
        bak={{ ciris_server_data_dir }}/data.bak.$ts
        cp -a {{ ciris_server_data_dir }}/data     $bak
        cp -a {{ ciris_server_data_dir }}/identity {{ ciris_server_data_dir }}/identity.bak.$ts
        # The node is still writing while this runs, so a file copy of a WAL
        # database can be torn. Replace each copied .db with the SQLite online
        # backup (a consistent snapshot) and check it: a one-way upgrade has no
        # way back except this snapshot.
        for db in {{ ciris_server_data_dir }}/data/*.db; do
          [ -e "$db" ] || continue
          n=$(basename "$db")
          rm -f "$bak/$n" "$bak/$n-wal" "$bak/$n-shm"
          sqlite3 "$db" ".timeout 30000" ".backup '$bak/$n'"
          [ "$(sqlite3 "$bak/$n" 'PRAGMA quick_check;')" = "ok" ] || { echo "snapshot $bak/$n failed quick_check" >&2; exit 1; }
          chown --reference="$db" "$bak/$n"
        done
        echo "$ts" > {{ ciris_server_data_dir }}/.last-upgrade-bak
        # Re-prune so the retention count includes the snapshot just taken.
        for kind in data identity; do
          ls -d {{ ciris_server_data_dir }}/${kind}.bak.* 2>/dev/null \
            | sort | head -n -{{ ciris_server_bak_retain }} | xargs -r rm -rf
        done
      args:
        executable: /bin/bash
      when: existing_data.stat.exists and not (ciris_server_fresh | default(false))
      changed_when: true

    # A snapshot must never be what pushes the node under its lens-store
    # minimum. Fail loudly instead of silently demoting the canonical.
    - name: Assert disk headroom above the lens-store minimum after snapshotting
      ansible.builtin.shell: |
        df -BG --output=avail {{ ciris_server_data_dir }} | tail -1 | tr -dc '0-9'
      args:
        executable: /bin/bash
      register: ciris_server_disk_free
      changed_when: false

    - name: FAIL — disk below lens-store minimum (node would demote to relay-only)
      ansible.builtin.fail:
        msg: |
          Only {{ ciris_server_disk_free.stdout | trim }} GiB free on {{ ciris_server_data_dir }},
          below ciris-server's baked lens-store minimum of {{ ciris_server_lens_store_min_gib }} GiB.
          Booting now would fail-safe demote this node to a Reticulum relay
          (lens_store=false: no local corpus, scorer/holonomic/replication off).
          Free disk before deploying — check for stale snapshots:
            du -shc {{ ciris_server_data_dir }}/*.bak.* 2>/dev/null | tail -1
      when: (ciris_server_disk_free.stdout | trim | int) < (ciris_server_lens_store_min_gib | int)

    # Wipe state only if explicitly requested. The v0.5.0 upgrade preserves identity
    # byte-identically — never wipe on a routine redeploy.
    - name: Clear prior CIRISServer data dir (only if ciris_server_fresh=true)
      ansible.builtin.file:
        path: "{{ ciris_server_data_dir }}"
        state: absent
      when: ciris_server_fresh | default(false)

    - name: Create CIRISServer build + data directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ ciris_server_build_dir }}",         owner: root, group: root, mode: "0755" }
        - { path: "{{ ciris_server_data_dir }}",          owner: "1000", group: "1000", mode: "0755" }
        - { path: "{{ ciris_server_data_dir }}/identity", owner: "1000", group: "1000", mode: "0700" }

    # Per BRIDGE_SEED_MESH.md: this role is now a FRESH-MINT flow. The
    # lens-steward seed-staging tasks (Ed25519 + ML-DSA-65 + RNS adoption from
    # the retired CIRISLens keyring) are gone — the wheel mints its own hybrid
    # identity under --key-id ciris-canonical-1 on a wiped home.

    # One-off local wheel instead of PyPI (ciris_server_wheel in defaults).
    - name: Local wheel — check name, version and sha256 on the controller
      when: ciris_server_wheel | length > 0
      block:
        - name: Local wheel — stat on the controller
          ansible.builtin.stat:
            path: "{{ ciris_server_wheel }}"
            get_checksum: true
            checksum_algorithm: sha256
          delegate_to: localhost
          become: false
          register: ciris_server_wheel_stat

        - name: FAIL — local wheel missing, misnamed or sha256 mismatch
          ansible.builtin.assert:
            that:
              - ciris_server_wheel_stat.stat.exists
              - (ciris_server_wheel | basename) is match('ciris_server-' ~ (ciris_server_version | regex_escape) ~ '-.*\.whl$')
              - ciris_server_wheel_sha256 | length == 64
              - ciris_server_wheel_stat.stat.checksum == (ciris_server_wheel_sha256 | lower)
            fail_msg: >-
              {{ ciris_server_wheel }}: exists={{ ciris_server_wheel_stat.stat.exists }},
              must be named ciris_server-{{ ciris_server_version }}-*.whl (pass -e ciris_server_version
              to match the wheel), sha256 {{ ciris_server_wheel_stat.stat.checksum | default('?') }}
              vs expected {{ ciris_server_wheel_sha256 or '(none given)' }}.

        - name: Local wheel — copy into the build context
          ansible.builtin.copy:
            src: "{{ ciris_server_wheel }}"
            dest: "{{ ciris_server_build_dir }}/{{ ciris_server_wheel | basename }}"
            mode: "0644"

        - name: Local wheel — sha256 on the host after copy
          ansible.builtin.stat:
            path: "{{ ciris_server_build_dir }}/{{ ciris_server_wheel | basename }}"
            get_checksum: true
            checksum_algorithm: sha256
          register: ciris_server_wheel_remote

        - name: FAIL — wheel changed in transit
          ansible.builtin.assert:
            that: ciris_server_wheel_remote.stat.checksum == (ciris_server_wheel_sha256 | lower)
            fail_msg: "host copy sha256 {{ ciris_server_wheel_remote.stat.checksum }} != {{ ciris_server_wheel_sha256 }}"

    # A wheel left from a one-off install must not linger in the build context
    # once deploys return to PyPI.
    - name: Find leftover local wheels in the build context
      ansible.builtin.find:
        paths: "{{ ciris_server_build_dir }}"
        patterns: "*.whl"
      register: ciris_server_stale_wheels

    - name: Remove leftover local wheels
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ ciris_server_stale_wheels.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename) != (ciris_server_wheel | basename)

    - name: Template Dockerfile (ciris-server wheel install + CLI flags)
      ansible.builtin.template:
        src: Dockerfile.j2
        dest: "{{ ciris_server_build_dir }}/Dockerfile"
        mode: "0644"
      notify: Restart CIRISServer

    - name: Template docker-compose.yml (zero-env)
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ ciris_server_build_dir }}/docker-compose.yml"
        mode: "0644"
      notify: Restart CIRISServer

    - name: Open Reticulum transport port (UDP + TCP)
      community.general.ufw:
        rule: allow
        port: "{{ ciris_server_reticulum_port }}"
        proto: "{{ item }}"
      loop:
        - udp
        - tcp

    - name: Start CIRISServer
      community.docker.docker_compose_v2:
        project_src: "{{ ciris_server_build_dir }}"
        state: present
        build: always

    - name: Wait for CIRISServer read API
      ansible.builtin.wait_for:
        port: "{{ ciris_server_read_port }}"
        delay: 5
        timeout: 240

    # The old budget here was 6 retries x 5s. On this 2-vCPU box the read API
    # can take ~3 min to answer, so the probe failed on EVERY deploy —
    # including 0.5.193, which was genuinely broken (CIRISServer#501). A check
    # that always fails cannot signal anything, so it is widened here and the
    # failure is classified below rather than raised blind.
    - name: Smoke probe — /v1/identity returns 200 with six-key aggregate
      ansible.builtin.uri:
        url: "http://localhost:{{ ciris_server_read_port }}/v1/identity"
        return_content: true
        timeout: 10
      register: ciris_server_identity
      retries: 24
      delay: 10
      until: ciris_server_identity.status == 200
      failed_when: false

    # A port that is LISTENING while its accept queue grows means the socket is
    # bound but userspace never calls accept() — the CIRISServer#501 hang.
    # Recv-Q on a LISTEN socket is the count of completed connections waiting to
    # be accepted; healthy is 0. This is what distinguishes "still booting"
    # (nothing bound / queue empty) from "hung" (bound, queue climbing).
    - name: Classify read-API failure (accept-loop hang vs slow boot)
      ansible.builtin.shell: |
        set -o pipefail
        pid=$(docker inspect ciris-server --format '{% raw %}{{.State.Pid}}{% endraw %}' 2>/dev/null) || exit 0
        [ -n "$pid" ] || exit 0
        nsenter -t "$pid" -n ss -tln 2>/dev/null \
          | awk '$1 == "LISTEN" && $4 ~ /:{{ ciris_server_read_port }}$/ { print $2; exit }'
      args:
        executable: /bin/bash
      register: ciris_server_acceptq
      changed_when: false
      failed_when: false
      when: ciris_server_identity.status != 200

    - name: FAIL — read API bound but not accepting (CIRISServer#501)
      ansible.builtin.fail:
        msg: |
          ciris-server {{ ciris_server_version }} bound :{{ ciris_server_read_port }} but is NOT accepting
          connections — {{ ciris_server_acceptq.stdout | trim }} completed connection(s) are queued and
          unaccepted (healthy = 0). The process is alive; its accept loop is starved.

          This is the CIRISServer#501 / #446 failure mode: on a 2-vCPU host the
          tokio runtime gets 2 workers, and one saturated worker makes HTTP
          unschedulable. Confirm and instrument with:

            pid=$(docker inspect ciris-server --format '{% raw %}{{.State.Pid}}{% endraw %}')
            nsenter -t $pid -n ss -tln | grep :{{ ciris_server_read_port }}   # Recv-Q climbing
            top -H -b -n1 -p $pid                                # a worker pegged at high %CPU

          Roll back by setting ciris_server_version to the last good release
          and re-running this play.
      when:
        - ciris_server_identity.status != 200
        - (ciris_server_acceptq.stdout | default('0') | trim | int) > 0

    - name: FAIL — read API never came up
      ansible.builtin.fail:
        msg: |
          ciris-server {{ ciris_server_version }} did not answer /v1/identity within 4 minutes
          and its accept queue is empty, so it is not the #501 hang — the node
          is still booting, crashed, or never bound. Check:
            docker logs ciris-server --tail 50
            docker inspect ciris-server --format '{% raw %}{{.State.Status}} restarts={{.RestartCount}}{% endraw %}'
      when: ciris_server_identity.status != 200

    - name: Smoke probe — /lens/api/v1/scores returns 200
      ansible.builtin.uri:
        url: "http://localhost:{{ ciris_server_read_port }}/lens/api/v1/scores"
        return_content: false
        status_code: [200]
      retries: 3
      delay: 3

    # The canonical must be ANNOUNCED: its owner-binding at cohort_scope
    # `federation`, not `self`. Unannounced, edge (#682) withholds its KEX
    # occurrence and signed route from every fresh node, so key exchange never
    # completes (CIRISServer#788). The field ships in 0.5.230 (CIRISServer#789);
    # before that its absence is UNKNOWN, never a pass.
    #   announced     — good
    #   unowned       — seated but unowned (the canonical is owned, so wrong here)
    #   NOT_ANNOUNCED — owned, unannounced, owner's pen absent (the #788 condition)
    #   check_failed  — the node could not evaluate it
    - name: Announce probe — /health node.canonical_announce
      ansible.builtin.uri:
        url: "http://localhost:{{ ciris_server_read_port }}/health"
        return_content: true
      register: ciris_server_health
      retries: 3
      delay: 3

    - name: Read canonical_announce
      ansible.builtin.set_fact:
        ciris_server_announce: "{{ ((ciris_server_health.content | from_json).node | default({})).canonical_announce | default('ABSENT') }}"

    - name: FAIL — canonical is not announced
      ansible.builtin.fail:
        msg: |
          ciris-server {{ ciris_server_version }}: /health node.canonical_announce = "{{ ciris_server_announce }}" (want "announced").

          {% if ciris_server_announce == 'NOT_ANNOUNCED' %}
          The canonical is owned but its owner-binding was never announced, so fresh
          nodes can never complete key exchange with it (CIRISServer#788). Fix: one boot
          with the owner's pen present under {{ ciris_server_home }}/identity/{user,keys}
          (the 2026-09-25 owner-record heal procedure), then verify
          "boot: seated canonical was NOT announced — announced now", shred the pen
          files and restart. Needs Eric's hardware-custodied key; the bridge cannot sign as owner.
          {% elif ciris_server_announce == 'unowned' %}
          The canonical reports itself seated but UNOWNED. It should be owned; check
          the ownership state before anything else.
          {% elif ciris_server_announce == 'ABSENT' %}
          The field is missing on a release that should carry it (>= 0.5.230). Treat
          the announce state as unknown and check the release.
          {% else %}
          The node could not evaluate its announce state; read docker logs ciris-server.
          {% endif %}
      when: >-
        ciris_server_announce != 'announced' and
        (ciris_server_announce != 'ABSENT' or ciris_server_version is version('0.5.230', '>='))

    - name: WARN — announce state UNKNOWN on this release (field ships in 0.5.230)
      ansible.builtin.debug:
        msg: >-
          UNKNOWN, not a pass: ciris-server {{ ciris_server_version }} predates
          node.canonical_announce (CIRISServer#789, 0.5.230), so this deploy cannot
          tell whether the canonical is announced (CIRISServer#788).
      when: ciris_server_announce == 'ABSENT'

    # Surface ownership-claim banner if this is an unclaimed/fresh boot.
    # The PIN is one-shot console/log only — never served over HTTP (runbook §7).
    - name: Capture OWNERSHIP UNCLAIMED banner + NodeCode + PIN (if present)
      ansible.builtin.shell: |
        docker logs ciris-server 2>&1 \
          | grep -E "OWNERSHIP UNCLAIMED|NodeCode|claim PIN|claim_pin" \
          | tail -8 || true
      register: ownership_banner
      changed_when: false

    - name: Log identity-continuity + ownership summary
      ansible.builtin.debug:
        msg: |
          CIRISServer v{{ ciris_server_version }} up.
          key_id        = {{ (ciris_server_identity.content | from_json).key_id | default('?') }}
          identity_hash = {{ (ciris_server_identity.content | from_json).identity_hash | default('?') }}
          pqc_key_id    = {{ (ciris_server_identity.content | from_json).pqc_key_id | default('?') }}
          (compare key_id to the prior 0.4.x value — byte-identical = no re-key)
          canonical_announce = {{ ciris_server_announce }}{{ ' (UNKNOWN before 0.5.230)' if ciris_server_announce == 'ABSENT' else '' }}

          {% if ownership_banner.stdout | length > 0 %}
          Ownership banner (founder claim — NodeCode + PIN are one-shot, console only):
          {{ ownership_banner.stdout | indent(4) }}
          {% else %}
          (No OWNERSHIP UNCLAIMED banner — node already owned or banner already scrolled off.)
          {% endif %}

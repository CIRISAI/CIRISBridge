# CIRISBridge Full Deployment - Active/Active
# Deploys identical services to both nodes
#
# Usage:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit us
#   ansible-playbook playbooks/site.yml --tags "caddy,billing"
#
# Both nodes are equal peers - no primary/secondary distinction. The billing
# database (Spock multi-master) is deployed by playbooks/spock-billing.yml.

---
- name: Common setup for all nodes
  hosts: all
  become: true
  roles:
    - common
  tags: [common]

- name: Deploy Caddy (TLS termination)
  hosts: all
  become: true
  roles:
    - caddy
  tags: [caddy]

- name: Deploy CIRISBilling
  hosts: all
  become: true
  roles:
    - billing
  tags: [billing]

- name: Deploy CIRISProxy
  hosts: all
  become: true
  roles:
    - proxy
  tags: [proxy]

# CIRISStatus — the public status and scoring feed, served under /status/* on
# lens.ciris-services-1.ai.
- name: Deploy CIRISStatus (US node only)
  hosts: all
  become: true
  roles:
    - ciris-status
  tags: [ciris-status, status]

# CIRISServer — the canonical federation node and its read API.
- name: Deploy CIRISServer (US node only)
  hosts: all
  become: true
  roles:
    - ciris-server
  tags: [ciris-server, server]

- name: Deploy Scheduler (systemd timers for health checks)
  hosts: all
  become: true
  roles:
    - scheduler
  tags: [scheduler]

# CIRISBridge Full Deployment - Active/Active
# Deploys identical services to both nodes
#
# Usage:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit us
#   ansible-playbook playbooks/site.yml --tags "dns,billing"
#
# Both nodes are equal peers - no primary/secondary distinction

---
- name: Common setup for all nodes
  hosts: all
  become: true
  roles:
    - common
  tags: [common]

# DECOMMISSIONED 2026-05-02: Constellation DNS replaced by Reticulum migration.
# Containers stopped on both nodes; data volumes retained at /opt/ciris/dns/.
# Zero traffic to cirisdns at decom time — all CIRIS domains delegate to
# Cloudflare/Hetzner. Role remains on disk under roles/constellation/ for
# reversibility; remove the role + this comment block + UFW 53 rules in
# roles/common/tasks/main.yml after Reticulum is load-bearing.
# - name: Deploy DNS (Constellation with GeoDNS)
#   hosts: all
#   become: true
#   roles:
#     - constellation
#   tags: [dns]

# DECOMMISSIONED 2026-05-02: legacy ciris-postgres on port 5432 superseded by Spock
# (ciris-billing-spock on 5433, multi-master). Containers stopped, data volumes
# retained at /opt/ciris/postgres/data on each node. Final dumps preserved at
# /data/backups/legacy-postgres-decom/ciris_billing_legacy_{us,eu}_20260502_*.sql.
# Restore: `cd /opt/ciris/postgres && docker compose start` if needed.
# Remove this play (and /opt/ciris/postgres) entirely after a 30-day soak.
# - name: Deploy PostgreSQL (bi-directional replication)
#   hosts: all
#   become: true
#   roles:
#     - postgres
#   tags: [postgres]

- name: Deploy Caddy (TLS termination)
  hosts: all
  become: true
  roles:
    - caddy
  tags: [caddy]

- name: Deploy CIRISBilling
  hosts: all
  become: true
  roles:
    - billing
  tags: [billing]

- name: Deploy CIRISProxy
  hosts: all
  become: true
  roles:
    - proxy
  tags: [proxy]

# RETIRED 2026-06-17: CIRISLens replaced by CIRISServer (Node A) + CIRISStatus (Node B).
# Lens Python ingest + TimescaleDB + Grafana are gone; lens *function* lives inside
# ciris-server (the abi3 wheel — pip install ciris-server==0.3.0). Same hostname,
# new endpoint surface (GET /lens/api/v1/* + /v1/identity), same federation identity
# (Ed25519 + ML-DSA-65 + RNS adopted byte-identically — no re-key).
# Cutover history: 0.1.1 rolled back (missing /v1/identity, CIRISServer#5);
# 0.3.0 ships on persist v8.4.0 / verify v5.10.0 (DSAR-gate met).
# Runbook: ../../CIRISServer/FSD/LENS_TO_SERVER_MIGRATION.md
# Role + dashboards retained at roles/lens/ for archival; cirislens-db kept up
# (read-only) until the import-traces seeding completes.
# - name: Deploy CIRISLens (US node only - centralized observability)
#   hosts: all
#   become: true
#   roles:
#     - lens
#   tags: [lens]

# Deploy CIRISStatus (Node B) — public scoring-feed monitor — first per DEPLOY.md §3.
# Path route /status/* on lens.ciris-services-1.ai. Initial deploy is prober-only;
# fabric mode (Flow A/B) enables when ciris-server (Node A) is up and we wire
# STATUS_CORPUS_DSN.
- name: Deploy CIRISStatus (US node only - Node B, public scoring-feed monitor)
  hosts: all
  become: true
  roles:
    - ciris-status
  tags: [ciris-status, status]

# Deploy CIRISServer (Node A) — the fabric node, lens slice. Hard cutover from
# CIRISLens. Same hostname, new endpoint surface.
- name: Deploy CIRISServer (US node only - fabric node, lens slice at 0.3)
  hosts: all
  become: true
  roles:
    - ciris-server
  tags: [ciris-server, server]

- name: Deploy Scheduler (systemd timers for health checks)
  hosts: all
  become: true
  roles:
    - scheduler
  tags: [scheduler]


---
# Security Scan Runbook
# Infrastructure security posture assessment
#
# IMPORTANT: This is a READ-ONLY scanning tool.
# No changes are made to the infrastructure.
#
# Expected open ports per node:
#   22   - SSH (secured with key auth, fail2ban)
#   53   - Constellation DNS (UDP/TCP)
#   80   - HTTP (ACME challenges only, redirects to 443)
#   443  - HTTPS (Caddy reverse proxy)
#   5432 - PostgreSQL (internal + replication between nodes)
#
# Usage:
#   # Quick security status
#   ansible-playbook -i inventory/production.yml runbooks/security-scan.yml --tags status
#
#   # Detailed port scan and unexpected listeners
#   ansible-playbook -i inventory/production.yml runbooks/security-scan.yml --tags ports
#
#   # Check for available security updates
#   ansible-playbook -i inventory/production.yml runbooks/security-scan.yml --tags packages
#
#   # SSH configuration audit
#   ansible-playbook -i inventory/production.yml runbooks/security-scan.yml --tags ssh
#
#   # Docker daemon security check
#   ansible-playbook -i inventory/production.yml runbooks/security-scan.yml --tags docker
#
#   # Complete security scan (all checks)
#   ansible-playbook -i inventory/production.yml runbooks/security-scan.yml --tags full
#
#   # Single region
#   ansible-playbook -i inventory/production.yml runbooks/security-scan.yml --limit us

- name: "SECURITY SCAN - Infrastructure Security Posture Assessment"
  hosts: all
  gather_facts: false
  vars:
    # Expected open ports
    expected_ports:
      - 22    # SSH
      - 53    # DNS
      - 80    # HTTP (ACME)
      - 443   # HTTPS
      - 5432  # PostgreSQL

  tasks:
    # =========================================================================
    # STATUS - Quick security overview
    # =========================================================================
    - name: "STATUS: Quick security overview"
      tags: [status, always]
      block:
        - name: "STATUS: Gather security metrics"
          ansible.builtin.shell: |
            echo "=== {{ inventory_hostname | upper }} - SECURITY STATUS ==="
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            # Listening ports
            echo "--- LISTENING PORTS (non-loopback TCP) ---"
            # Loopback binds (systemd-resolved on 127.0.0.53%lo, docker-proxy
            # helpers) are not reachable from outside and used to show up here
            # as a false port 53 on EU after Constellation was retired.
            ss -Htln | awk '{print $4}' \
              | grep -vE '^(127\.|\[::1\]|\[::ffff:127\.)|%lo:' \
              | sed 's/.*://' | sort -n | uniq | tr '\n' ' '
            echo ""
            echo ""

            # SSH status
            echo "--- SSH SECURITY (effective config via sshd -T) ---"
            # Read what sshd will ACTUALLY enforce, not one file. The hardening
            # lives in sshd_config.d/00- and 01-ciris-hardening.conf; the main
            # sshd_config still says "PermitRootLogin yes" and the cloud-init file
            # 50-cloud-init.conf says "PasswordAuthentication yes", both
            # overridden under first-match-wins (CLAUDE.md gotcha #7). Grepping
            # the main file produced false "may be enabled" warnings.
            EFF=$(sshd -T 2>/dev/null)
            PRL=$(printf '%s\n' "$EFF" | awk '$1=="permitrootlogin"{print $2}')
            PWA=$(printf '%s\n' "$EFF" | awk '$1=="passwordauthentication"{print $2}')
            if [ -z "$EFF" ]; then
              echo "⚠ WARNING: sshd -T failed — could not read effective SSH config"
            else
              # Root with keys only is the INTENDED posture (Ansible deploys as
              # root). Only password-capable root login is a finding.
              case "$PRL" in
                no)                                echo "✓ Root login disabled" ;;
                prohibit-password|without-password) echo "✓ Root login key-only ($PRL)" ;;
                forced-commands-only)              echo "✓ Root login forced-commands-only" ;;
                *)                                 echo "⚠ WARNING: Root login allows passwords (permitrootlogin $PRL)" ;;
              esac
              if [ "$PWA" = "no" ]; then
                echo "✓ Password authentication disabled"
              else
                echo "⚠ WARNING: Password authentication enabled (passwordauthentication $PWA)"
              fi
            fi
            echo ""

            # Fail2ban status
            echo "--- FAIL2BAN STATUS ---"
            if systemctl is-active --quiet fail2ban 2>/dev/null; then
              echo "✓ fail2ban is running"
              BANNED=$(fail2ban-client status sshd 2>/dev/null | grep "Currently banned:" | awk '{print $NF}')
              TOTAL_BANNED=$(fail2ban-client status sshd 2>/dev/null | grep "Total banned:" | awk '{print $NF}')
              echo "  Currently banned: ${BANNED:-0}"
              echo "  Total banned: ${TOTAL_BANNED:-0}"
            else
              echo "⚠ WARNING: fail2ban not running"
            fi
            echo ""

            # Firewall status
            echo "--- FIREWALL STATUS ---"
            if command -v ufw &> /dev/null; then
              UFW_STATUS=$(ufw status 2>/dev/null | head -1)
              echo "UFW: $UFW_STATUS"
            elif command -v iptables &> /dev/null; then
              RULE_COUNT=$(iptables -L | grep -c "^Chain")
              echo "iptables: $RULE_COUNT chains configured"
            else
              echo "⚠ WARNING: No firewall detected"
            fi
            echo ""

            # Failed SSH attempts (last 24h)
            echo "--- RECENT SSH FAILURES ---"
            FAILED=$(grep -c "Failed password" /var/log/auth.log 2>/dev/null)
            FAILED=${FAILED:-0}
            INVALID=$(grep -c "Invalid user" /var/log/auth.log 2>/dev/null)
            INVALID=${INVALID:-0}
            echo "Failed password attempts: $FAILED"
            echo "Invalid user attempts: $INVALID"
            echo ""

            # Security updates available
            echo "--- SECURITY UPDATES ---"
            apt-get update -qq 2>/dev/null
            SECURITY_UPDATES=$(apt-get upgrade -s 2>/dev/null | grep -c "^Inst.*security")
            SECURITY_UPDATES=${SECURITY_UPDATES:-0}
            if [ "$SECURITY_UPDATES" -gt 0 ]; then
              echo "⚠ WARNING: $SECURITY_UPDATES security updates available"
            else
              echo "✓ System is up to date"
            fi
            echo ""

            # Docker socket permissions
            echo "--- DOCKER SECURITY ---"
            if [ -S /var/run/docker.sock ]; then
              SOCK_PERMS=$(stat -c "%a" /var/run/docker.sock)
              echo "Docker socket permissions: $SOCK_PERMS"
              if [ "$SOCK_PERMS" = "660" ] || [ "$SOCK_PERMS" = "600" ]; then
                echo "✓ Docker socket has restricted permissions"
              else
                echo "⚠ WARNING: Docker socket may be too permissive"
              fi
            fi
          register: status
          changed_when: false

        - name: "STATUS: Display"
          ansible.builtin.debug:
            msg: "{{ status.stdout }}"

    # =========================================================================
    # PORTS - Detailed port analysis
    # =========================================================================
    - name: "PORTS: Detailed port analysis and unexpected listeners"
      tags: [ports, full, never]
      block:
        - name: "PORTS: Analyze listening ports"
          ansible.builtin.shell: |
            # POSIX sh — the ansible shell module runs /bin/sh (dash). This block
            # previously used bash arrays and process substitution and died at
            # line 11 with 'Syntax error: "(" unexpected', which aborted the
            # whole --tags full scan: PACKAGES, SSH and DOCKER never ran.
            # (CLAUDE.md gotcha #10.)
            echo "=== {{ inventory_hostname | upper }} - PORT ANALYSIS ==="
            echo ""

            echo "--- ALL LISTENING SOCKETS ---"
            ss -tulnp | grep -E "LISTEN|UNCONN"
            echo ""

            # The exposure question is what listens on a ROUTABLE address.
            # Loopback binds (127.x, ::1, systemd-resolved on 127.0.0.53) are
            # not exposure and are excluded. Expected set measured 2026-09-23:
            #   22 ssh | 68 dhcp client | 80/443 caddy | 5433 spock
            #   8000 billing (bound public, firewalled) | 8210/8211 vault
            #   4242/4243/4253 fabric + status nodes (US only)
            # 53 (DNS) and 5432 (legacy postgres) are decommissioned and are
            # deliberately NOT expected — if either reappears, that is a finding.
            echo "--- ROUTABLE LISTENER VALIDATION ---"
            EXPECTED=" 22 68 80 443 4242 4243 4253 5433 8000 8210 8211 "
            UNEXPECTED=$(ss -tulnH | awk '{print $5}' \
              | grep -vE '^(127\.|\[::1\]|::1:)' \
              | sed 's/.*://' | sort -un \
              | while read -r port; do
                  case "$EXPECTED" in *" $port "*) ;; *) echo "$port" ;; esac
                done)
            if [ -n "$UNEXPECTED" ]; then
              for port in $UNEXPECTED; do
                PROC=$(ss -tulnpH | grep ":$port " | grep -oE 'users:\(\([^)]*\)\)' | head -1)
                printf '%s\n' "⚠ WARNING: unexpected routable listener on port $port - ${PROC:-unknown}"
              done
            else
              echo "✓ All routable listeners are expected"
            fi
            echo ""

            echo "--- LOOPBACK-ONLY LISTENERS (not exposed; informational) ---"
            ss -tulnH | awk '{print $5}' | grep -E '^(127\.|\[::1\]|::1:)' | sort -u | sed 's/^/  /'
            echo ""
          register: ports
          changed_when: false

        - name: "PORTS: Display"
          ansible.builtin.debug:
            msg: "{{ ports.stdout }}"

    # =========================================================================
    # PACKAGES - Security update check
    # =========================================================================
    - name: "PACKAGES: Check for security updates"
      tags: [packages, full, never]
      block:
        - name: "PACKAGES: Check available updates"
          ansible.builtin.shell: |
            echo "=== {{ inventory_hostname | upper }} - PACKAGE SECURITY ==="
            echo ""

            # Update package cache
            echo "Updating package cache..."
            apt-get update -qq 2>/dev/null
            echo ""

            # Check for security updates
            echo "--- SECURITY UPDATES AVAILABLE ---"
            apt-get upgrade -s 2>/dev/null | grep "^Inst" | grep -i security || echo "✓ No security updates available"
            echo ""

            # Summary
            SECURITY_COUNT=$(apt-get upgrade -s 2>/dev/null | grep -c "^Inst.*security")
            SECURITY_COUNT=${SECURITY_COUNT:-0}
            TOTAL_COUNT=$(apt-get upgrade -s 2>/dev/null | grep -c "^Inst")
            TOTAL_COUNT=${TOTAL_COUNT:-0}
            echo "--- UPDATE SUMMARY ---"
            echo "Security updates: $SECURITY_COUNT"
            echo "Total updates: $TOTAL_COUNT"
            echo ""

            # Critical packages
            echo "--- CRITICAL PACKAGE VERSIONS ---"
            dpkg -l | grep -E "^ii" | grep -E "openssh-server|docker|fail2ban|postgresql|caddy" | awk '{print $2, $3}'
            echo ""

            # Check for outdated Docker images
            echo "--- DOCKER IMAGE STATUS ---"
            for image in $(docker images --format "{% raw %}{{.Repository}}{% endraw %}:{% raw %}{{.Tag}}{% endraw %}" | grep -E "ciris|postgres|redis|caddy"); do
              echo "Checking $image..."
              # Note: This only checks locally, not remote registry
            done
            docker images --format "table {% raw %}{{.Repository}}{% endraw %}\t{% raw %}{{.Tag}}{% endraw %}\t{% raw %}{{.CreatedAt}}{% endraw %}" | grep -E "ciris|postgres|redis|caddy"
          register: packages
          changed_when: false

        - name: "PACKAGES: Display"
          ansible.builtin.debug:
            msg: "{{ packages.stdout }}"

    # =========================================================================
    # SSH - SSH configuration audit
    # =========================================================================
    - name: "SSH: SSH configuration security audit"
      tags: [ssh, full, never]
      block:
        - name: "SSH: Audit SSH configuration"
          ansible.builtin.shell: |
            echo "=== {{ inventory_hostname | upper }} - SSH SECURITY AUDIT ==="
            echo ""

            # Every check below reads the EFFECTIVE config (sshd -T), which
            # resolves Include drop-ins and first-match-wins. Grepping
            # /etc/ssh/sshd_config alone reads directives sshd never applies.
            EFF=$(sshd -T 2>/dev/null)
            eff() { printf '%s\n' "$EFF" | awk -v k="$1" '$1==k{$1=""; sub(/^ /,""); print; exit}'; }
            WARNINGS=""
            if [ -z "$EFF" ]; then
              echo "⚠ WARNING: sshd -T failed — cannot audit effective SSH config"
              WARNINGS="${WARNINGS}sshd -T unavailable\n"
            fi

            echo "--- ROOT LOGIN ---"
            PRL=$(eff permitrootlogin); echo "permitrootlogin $PRL"
            case "$PRL" in
              no|prohibit-password|without-password|forced-commands-only)
                echo "✓ Root cannot log in with a password" ;;
              *)
                echo "⚠ WARNING: root login accepts passwords"
                WARNINGS="${WARNINGS}Root login accepts passwords ($PRL)\n" ;;
            esac
            echo ""

            echo "--- PASSWORD / KEYBOARD-INTERACTIVE ---"
            PWA=$(eff passwordauthentication); KBD=$(eff kbdinteractiveauthentication)
            echo "passwordauthentication $PWA"; echo "kbdinteractiveauthentication $KBD"
            [ "$PWA" = "no" ] && echo "✓ Password authentication disabled" || {
              echo "⚠ WARNING: Password authentication enabled"
              WARNINGS="${WARNINGS}Password authentication enabled\n"; }
            [ "$KBD" = "no" ] || {
              echo "⚠ WARNING: Keyboard-interactive authentication enabled"
              WARNINGS="${WARNINGS}Keyboard-interactive enabled\n"; }
            echo ""

            echo "--- PUBLIC KEY AUTHENTICATION ---"
            PKA=$(eff pubkeyauthentication); echo "pubkeyauthentication $PKA"
            [ "$PKA" = "yes" ] && echo "✓ Public key authentication enabled" || {
              echo "⚠ WARNING: Public key authentication disabled"
              WARNINGS="${WARNINGS}Public key authentication disabled\n"; }
            echo ""
            # (Protocol 1 was removed from OpenSSH in 7.6; sshd -T no longer
            # reports a protocol key, so there is nothing to check.)

            echo "--- CIPHERS AND KEX (effective) ---"
            echo "ciphers: $(eff ciphers)"
            echo "kexalgorithms: $(eff kexalgorithms)"
            echo ""

            echo "--- AUTHENTICATION ATTEMPTS ---"
            MAX_NUM=$(eff maxauthtries); echo "maxauthtries ${MAX_NUM:-?}"
            if [ "${MAX_NUM:-6}" -gt 3 ]; then
              echo "ℹ INFO: Consider reducing MaxAuthTries to 3"
            fi
            echo ""

            # Check authorized_keys
            echo "--- AUTHORIZED KEYS ---"
            if [ -f /root/.ssh/authorized_keys ]; then
              KEY_COUNT=$(grep -c "^ssh-" /root/.ssh/authorized_keys 2>/dev/null)
              KEY_COUNT=${KEY_COUNT:-0}
              echo "Root authorized keys: $KEY_COUNT"
              PERMS=$(stat -c "%a" /root/.ssh/authorized_keys)
              if [ "$PERMS" = "600" ]; then
                echo "✓ Correct permissions on authorized_keys ($PERMS)"
              else
                echo "⚠ WARNING: Incorrect permissions on authorized_keys ($PERMS, should be 600)"
                WARNINGS="${WARNINGS}authorized_keys has wrong permissions\n"
              fi
            else
              echo "⚠ WARNING: No authorized_keys file found for root"
            fi
            echo ""

            # Check for other users with SSH access
            echo "--- USERS WITH SSH ACCESS ---"
            getent passwd | awk -F: '$3 >= 1000 {print $1}' | while read user; do
              if [ -f "/home/$user/.ssh/authorized_keys" ]; then
                KEY_COUNT=$(grep -c "^ssh-" "/home/$user/.ssh/authorized_keys" 2>/dev/null)
                KEY_COUNT=${KEY_COUNT:-0}
                echo "$user: $KEY_COUNT authorized keys"
              fi
            done
            echo ""

            # Recent SSH activity
            echo "--- RECENT SSH ACTIVITY ---"
            echo "Successful logins (last 10):"
            last -10 | grep -E "pts|tty" || echo "None"
            echo ""
            echo "Failed login attempts (last 24h):"
            FAILED=$(grep "Failed password" /var/log/auth.log 2>/dev/null | tail -5)
            if [ -n "$FAILED" ]; then
              echo "$FAILED"
            else
              echo "✓ No failed attempts"
            fi
            echo ""

            # Summary
            echo "--- SECURITY SUMMARY ---"
            if [ -z "$WARNINGS" ]; then
              echo "✓ SSH configuration follows security best practices"
            else
              echo "⚠ WARNINGS FOUND:"
              printf '%b' "$WARNINGS"
            fi
          register: ssh_audit
          changed_when: false

        - name: "SSH: Display"
          ansible.builtin.debug:
            msg: "{{ ssh_audit.stdout }}"

    # =========================================================================
    # DOCKER - Docker daemon security
    # =========================================================================
    - name: "DOCKER: Docker daemon security check"
      tags: [docker, full, never]
      block:
        - name: "DOCKER: Audit Docker security"
          ansible.builtin.shell: |
            echo "=== {{ inventory_hostname | upper }} - DOCKER SECURITY AUDIT ==="
            echo ""

            WARNINGS=""

            # Docker socket permissions
            echo "--- DOCKER SOCKET ---"
            if [ -S /var/run/docker.sock ]; then
              PERMS=$(stat -c "%a" /var/run/docker.sock)
              OWNER=$(stat -c "%U:%G" /var/run/docker.sock)
              echo "Socket: /var/run/docker.sock"
              echo "Permissions: $PERMS"
              echo "Owner: $OWNER"

              if [ "$PERMS" = "660" ] || [ "$PERMS" = "600" ]; then
                echo "✓ Socket has restricted permissions"
              else
                echo "⚠ WARNING: Socket permissions may be too permissive"
                WARNINGS="${WARNINGS}Docker socket has permissive permissions ($PERMS)\n"
              fi
            else
              echo "⚠ Docker socket not found"
            fi
            echo ""

            # Docker daemon configuration
            echo "--- DOCKER DAEMON CONFIG ---"
            if [ -f /etc/docker/daemon.json ]; then
              echo "Config file exists: /etc/docker/daemon.json"
              cat /etc/docker/daemon.json 2>/dev/null || echo "Cannot read config"
            else
              echo "ℹ INFO: No custom daemon.json (using defaults)"
            fi
            echo ""

            # Check for privileged containers
            echo "--- PRIVILEGED CONTAINERS ---"
            PRIVILEGED=$(docker ps --format "{% raw %}{{.Names}}{% endraw %}" --filter "status=running" | while read container; do
              if docker inspect "$container" --format '{% raw %}{{.HostConfig.Privileged}}{% endraw %}' 2>/dev/null | grep -q "true"; then
                echo "$container"
              fi
            done)

            if [ -n "$PRIVILEGED" ]; then
              echo "⚠ WARNING: Privileged containers found:"
              echo "$PRIVILEGED"
              WARNINGS="${WARNINGS}Privileged containers running\n"
            else
              echo "✓ No privileged containers"
            fi
            echo ""

            # Check container capabilities
            echo "--- CONTAINER CAPABILITIES ---"
            docker ps --format "{% raw %}{{.Names}}{% endraw %}" --filter "status=running" | while read container; do
              echo "$container:"
              CAPS=$(docker inspect "$container" --format '{% raw %}{{.HostConfig.CapAdd}}{% endraw %}' 2>/dev/null)
              if [ "$CAPS" = "[]" ] || [ "$CAPS" = "<no value>" ]; then
                echo "  ✓ No additional capabilities"
              else
                echo "  Capabilities: $CAPS"
              fi
            done
            echo ""

            # Check for containers running as root
            echo "--- CONTAINER USER ---"
            docker ps --format "{% raw %}{{.Names}}{% endraw %}" --filter "status=running" | while read container; do
              USER=$(docker inspect "$container" --format '{% raw %}{{.Config.User}}{% endraw %}' 2>/dev/null)
              if [ -z "$USER" ]; then
                echo "$container: ⚠ Running as root (no user specified)"
              else
                echo "$container: ✓ Running as user $USER"
              fi
            done
            echo ""

            # Check host network mode
            echo "--- NETWORK MODE ---"
            HOST_NET=$(docker ps --format "{% raw %}{{.Names}}{% endraw %}" --filter "status=running" | while read container; do
              if docker inspect "$container" --format '{% raw %}{{.HostConfig.NetworkMode}}{% endraw %}' 2>/dev/null | grep -q "host"; then
                echo "$container"
              fi
            done)

            if [ -n "$HOST_NET" ]; then
              echo "ℹ INFO: Containers using host network:"
              echo "$HOST_NET"
              echo "(This may be expected for DNS/network services)"
            else
              echo "✓ No containers using host network mode"
            fi
            echo ""

            # Check volume mounts
            echo "--- SENSITIVE VOLUME MOUNTS ---"
            docker ps --format "{% raw %}{{.Names}}{% endraw %}" --filter "status=running" | while read container; do
              MOUNTS=$(docker inspect "$container" --format '{% raw %}{{range .Mounts}}{% endraw %}{% raw %}{{.Source}}{% endraw %}:{% raw %}{{.Destination}}{% endraw %} {% raw %}{{end}}{% endraw %}' 2>/dev/null)
              if echo "$MOUNTS" | grep -qE "/etc|/root|/var/run/docker.sock"; then
                echo "$container:"
                echo "  ⚠ WARNING: Sensitive mounts detected"
                echo "$MOUNTS" | tr ' ' '\n' | grep -E "/etc|/root|/var/run/docker.sock" | sed 's/^/    /'
              fi
            done
            echo ""

            # Docker version
            echo "--- DOCKER VERSION ---"
            docker version --format '{% raw %}{{.Server.Version}}{% endraw %}' 2>/dev/null || echo "Cannot determine version"
            echo ""

            # Image security
            echo "--- IMAGE SOURCES ---"
            docker images --format "{% raw %}{{.Repository}}{% endraw %}" | sort -u | while read repo; do
              if echo "$repo" | grep -qE "^(localhost|[0-9]+\.)"; then
                echo "⚠ Local/private registry: $repo"
              elif echo "$repo" | grep -qE "ghcr.io|docker.io"; then
                echo "✓ Trusted registry: $repo"
              else
                echo "ℹ INFO: Unknown registry: $repo"
              fi
            done
            echo ""

            # Summary
            echo "--- SECURITY SUMMARY ---"
            if [ -z "$WARNINGS" ]; then
              echo "✓ Docker configuration follows security best practices"
            else
              echo "⚠ WARNINGS FOUND:"
              printf '%b' "$WARNINGS"
            fi
          register: docker_audit
          changed_when: false

        - name: "DOCKER: Display"
          ansible.builtin.debug:
            msg: "{{ docker_audit.stdout }}"

    # =========================================================================
    # FULL - Complete security scan
    # =========================================================================
    - name: "FULL: Complete security scan summary"
      tags: [full, never]
      block:
        - name: "FULL: Generate summary report"
          ansible.builtin.shell: |
            echo "=== {{ inventory_hostname | upper }} - COMPLETE SECURITY SCAN SUMMARY ==="
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "All detailed checks have been run above. Key findings:"
            echo ""

            # Count warnings across all checks
            echo "This scan checked:"
            echo "  ✓ Listening ports and unexpected services"
            echo "  ✓ Available security updates"
            echo "  ✓ SSH configuration hardening"
            echo "  ✓ Docker daemon and container security"
            echo "  ✓ Firewall and fail2ban status"
            echo ""
            echo "Review the detailed output above for specific findings."
            echo ""
            echo "RECOMMENDED ACTIONS:"
            echo "1. Apply security updates if available (--tags packages)"
            echo "2. Review any unexpected listening ports (--tags ports)"
            echo "3. Ensure SSH hardening is complete (--tags ssh)"
            echo "4. Verify fail2ban is blocking attacks (check /var/log/auth.log)"
            echo "5. Schedule regular security scans (weekly recommended)"
          register: full_summary
          changed_when: false

        - name: "FULL: Display summary"
          ansible.builtin.debug:
            msg: "{{ full_summary.stdout }}"

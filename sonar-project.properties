sonar.projectKey=CIRISAI_CIRISBridge
sonar.organization=cirisai

# Ansible/IaC analysis
sonar.sources=ansible,terraform,scripts
sonar.ansible.ansible-lint.reportPaths=ansible-lint-report.json

# Exclusions
sonar.exclusions=**/__pycache__/**,**/venv/**,**/*.tfstate,**/*.tfstate.backup

# scripts/ holds operator tools that run against the live nodes; the test
# suite checks repository structure, not their code paths, so no coverage is
# reported for them. They are still analysed for bugs and vulnerabilities.
sonar.coverage.exclusions=scripts/**,tools/**
